# 1단계: 코드베이스 휴리스틱 스캔 + (선택) OpenAI 요약 → GitHub Issue 생성
name: AI Issue Detector

on:
  schedule:
    # 매주 월요일 03:17 UTC (main 브랜치에 있어야 schedule 동작)
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      max_findings:
        description: Max issues to open per run
        required: false
        default: "10"
      auto_queue_for_fix:
        description: Automatically add ai-auto-fix label (solver will pick up)
        type: boolean
        default: false

concurrency:
  group: ai-issue-detector
  cancel-in-progress: false

jobs:
  detect-and-file-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Unity C# heuristic scan
        id: scan
        run: |
          MAX_FINDINGS="${{ github.event.inputs.max_findings || '10' }}" \
            python3 .github/scripts/scan_unity_cs.py Assets > scan_results.json
          echo "scanned_files=$(jq -r '.scanned_files' scan_results.json)" >> "$GITHUB_OUTPUT"
          echo "finding_count=$(jq -r '.finding_count' scan_results.json)" >> "$GITHUB_OUTPUT"

      - name: Enrich findings with OpenAI (optional)
        id: enrich
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "skip_enrich=true" >> "$GITHUB_OUTPUT"
            cp scan_results.json enriched_results.json
            exit 0
          fi
          python3 << 'PY'
          import json, os, urllib.request

          with open("scan_results.json") as f:
              data = json.load(f)
          findings = data.get("findings", [])[:10]
          if not findings:
              with open("enriched_results.json", "w") as out:
                  json.dump(data, out)
              raise SystemExit(0)

          prompt = {
              "role": "user",
              "content": (
                  "You are a Unity/C# tech lead. Given scan findings JSON, return ONLY valid JSON: "
                  '{"findings":[{"fingerprint":"...","priority":"P0|P1|P2","summary":"one line","risk":"bug|gc|refactor"}]} '
                  "Keep same fingerprints. Input:\n" + json.dumps(findings, ensure_ascii=False)
              ),
          }
          body = json.dumps({
              "model": "gpt-4o-mini",
              "temperature": 0.2,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "Respond with JSON only."},
                  prompt,
              ],
          }).encode()
          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.load(resp)
          content = result["choices"][0]["message"]["content"]
          enriched = json.loads(content)
          by_fp = {f["fingerprint"]: f for f in enriched.get("findings", [])}
          for item in data.get("findings", []):
              extra = by_fp.get(item["fingerprint"], {})
              item["ai_priority"] = extra.get("priority", "P2")
              item["ai_summary"] = extra.get("summary", "")
              item["ai_risk"] = extra.get("risk", "refactor")
          with open("enriched_results.json", "w") as out:
              json.dump(data, out, ensure_ascii=False, indent=2)
          PY
          echo "skip_enrich=false" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'ai-detected', color: '1d76db', description: 'Auto-detected by issue_detector workflow' },
              { name: 'ai-auto-fix', color: '0e8a16', description: 'Queue for autonomous fix PR (issue_solver)' },
              { name: 'ai-scan-gc', color: 'fbca04', description: 'GC / allocation risk' },
              { name: 'ai-scan-bug', color: 'd93f0b', description: 'Likely bug pattern' },
              { name: 'ai-scan-refactor', color: '5319e7', description: 'Refactor recommended' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: l.name });
              } catch {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              }
            }

      - name: Create or skip GitHub Issues
        uses: actions/github-script@v7
        env:
          AUTO_QUEUE: ${{ github.event.inputs.auto_queue_for_fix || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const autoQueue = process.env.AUTO_QUEUE === 'true';
            const data = JSON.parse(fs.readFileSync('enriched_results.json', 'utf8'));
            const findings = data.findings || [];
            const maxOpen = Number('${{ github.event.inputs.max_findings || "10" }}');
            let created = 0;
            let skipped = 0;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'ai-detected',
              per_page: 100,
            });

            const existingFingerprints = new Set();
            for (const issue of openIssues) {
              const m = (issue.body || '').match(/<!--\s*ai-fingerprint:\s*([a-f0-9]+)\s*-->/i);
              if (m) existingFingerprints.add(m[1]);
            }

            for (const f of findings) {
              if (created >= maxOpen) break;
              if (existingFingerprints.has(f.fingerprint)) {
                skipped++;
                continue;
              }

              const riskLabel =
                f.ai_risk === 'gc' ? 'ai-scan-gc' :
                f.ai_risk === 'bug' ? 'ai-scan-bug' : 'ai-scan-refactor';
              const labels = ['ai-detected', riskLabel];
              if (autoQueue) labels.push('ai-auto-fix');

              const aiBlock = f.ai_summary
                ? `\n\n**AI summary:** ${f.ai_summary} (${f.ai_priority || 'P2'})`
                : '';

              const body = `${f.body}${aiBlock}

<!-- ai-fingerprint: ${f.fingerprint} -->
<!-- ai-source: issue_detector -->`;

              await github.rest.issues.create({
                ...context.repo,
                title: f.title,
                body,
                labels,
              });
              created++;
            }

            core.summary.addRaw(`Created ${created} issue(s), skipped ${skipped} duplicate(s).`);
            if (!findings.length) {
              core.info('No findings from scan.');
            }
